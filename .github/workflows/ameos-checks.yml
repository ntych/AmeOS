name: AmeOS build tooling

on:
  push:
    paths:
      - 'ameos/**'
      - '.github/workflows/ameos-checks.yml'
  pull_request:
    paths:
      - 'ameos/**'
      - '.github/workflows/ameos-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    name: POSIX tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release orchestration
        run: node ameos/tests/build-release.test.mjs
      - name: Check overlay script
        run: node ameos/tests/apply-overlay.test.mjs
      - name: Check AmeDE Wayfire session
        run: node ameos/tests/amede-session.test.mjs
      - name: Check desktop package manifest
        run: sh ameos/scripts/check-desktop-packages.sh
