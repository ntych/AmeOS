# AmeOS package repository configuration.
# Installed by the AmeOS overlay; do not edit — changes will be overwritten.
# To add a custom repository, create a separate file in /etc/pkg/.
#
# This file configures the official FreeBSD package repository for the
# AmeOS @AMEOS_VERSION@ desktop profile.  Packages are built by the
# FreeBSD project for @PKG_ABI@ and are not modified by AmeOS.
#
# Policy: package installation is opt-in per profile.  Console profiles
# (base-amd64, compact-amd64, v0.2-b-amd64) ship without this file.

AmeOS: {
  url: "pkg+https://pkg.FreeBSD.org/${ABI}/@PKG_REPO_BRANCH@",
  mirror_type: "srv",
  signature_type: "fingerprints",
  fingerprints: "/usr/share/keys/pkg",
  enabled: yes
}
