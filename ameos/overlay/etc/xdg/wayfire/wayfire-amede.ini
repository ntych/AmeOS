# Wayfire configuration for AmeDE.
# Minimal compositor setup: single output, no panels, autostart AmeDE.
# Installed by AmeOS overlay; do not edit locally.  To customize, copy to
# ~/.config/wayfire/wayfire.ini and add your own rules and keybindings.

[core]
# Single output at 1024x768 (for testing); scales to actual resolution on physical hardware.
outputs = DP-1
xwayland_enabled = true

# Autostart AmeDE when Wayfire starts. AmeDE window becomes the "desktop".
autostart_wf_shell = false

[output:DP-1]
# Fallback resolution for headless/virtual environments.
mode = 1024x768@60
position = 0,0
transform = normal

[input]
# Keyboard layout: US by default. Users may override in ~/.config/wayfire/wayfire.ini
kb_layout = us
kb_model = pc105
kb_options =
kb_repeat_rate = 40
kb_repeat_delay = 400

# Mouse settings
pointer_speed = 0
pointer_accel_profile = adaptive

[idle]
# Lock screen / DPMS after 10 minutes idle (optional; AmeDE can provide its own)
screensaver_timeout = 600
dpms_timeout = 600

[pixdirt]
# Pixdirt plugin: screen tearing; disable by default
enabled = false

[resize]
# Enable resizing with Super+Right mouse button
enabled = true

[move]
# Enable moving windows with Super+Left mouse button
enabled = true

[decoration]
# Window decorators; disable for AmeDE fullscreen or frameless mode
enabled = false

[autostart]
# Launch AmeDE. Wayfire runs this shell command at startup.
# AmeDE inherits Wayland socket from Wayfire parent.
amede = amede --theme amaterasu

# Optional: launch XWayland applications (xterm, firefox via XWayland, etc.)
# xterm = xterm -e sh
