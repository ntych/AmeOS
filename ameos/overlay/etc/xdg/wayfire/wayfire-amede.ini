# Wayfire configuration for AmeDE.
# Minimal compositor setup: auto-detect outputs, no wf-shell, autostart AmeDE.
# Installed by the AmeOS overlay; users can override it with
# ~/.config/wayfire/wayfire.ini.

[core]
# Load only the plugins required by the AmeDE session.
plugins = autostart move resize
# Wayfire 0.8.x uses the xwayland key (not xwayland_enabled).
xwayland = true

# Do not hard-code an output name. Wayfire auto-detects DP-1, HDMI-A-1,
# Virtual-1, and physical displays. Per-output mode overrides belong in the
# user's wayfire.ini because names differ across hardware and VMs.

[input]
# Keyboard layout: US by default. Users may override in their own config.
kb_layout = us
kb_model = pc105
kb_options =
kb_repeat_rate = 40
kb_repeat_delay = 400

# Mouse settings
pointer_speed = 0
pointer_accel_profile = adaptive

[idle]
# Lock screen / DPMS after 10 minutes idle. A lock-screen daemon can override this.
screensaver_timeout = 600
dpms_timeout = 600

[resize]
# Enable resizing with Super+Right mouse button.
enabled = true

[move]
# Enable moving windows with Super+Left mouse button.
enabled = true

[autostart]
# Launch AmeDE. Wayfire runs this command after the Wayland socket is ready.
amede = amede --theme amaterasu

# Optional XWayland applications can be added by the user:
# xterm = xterm -e sh
