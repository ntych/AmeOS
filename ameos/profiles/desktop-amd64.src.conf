# SPDX-License-Identifier: BSD-2-Clause
# src.conf for the AmeOS desktop profile.
# Keeps more of the base system than compact-amd64 to support
# Wayland, graphics drivers and pkg post-install hooks.
WITH_REPRODUCIBLE_BUILD=yes
WITH_REPRODUCIBLE_PATHS=yes
WITHOUT_DEBUG_FILES=yes
WITHOUT_KERNEL_SYMBOLS=yes
WITHOUT_TESTS=yes
WITHOUT_LLVM_TARGET_ALL=yes
# Keep X11 client libs in base so Wayland compatibility layers can link them.
# WITHOUT_X11=yes  — intentionally NOT set for the desktop profile.
