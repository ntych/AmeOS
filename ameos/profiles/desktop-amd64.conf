# SPDX-License-Identifier: BSD-2-Clause
# AmeOS desktop profile: Wayland session with AmeDE, Wayfire and pkg packages.
# Package source: official FreeBSD pkg repository for 16.0-CURRENT/amd64.
AMEOS_VERSION="0.3-dev"
TARGET="amd64"
TARGET_ARCH="amd64"
KERNCONF="GENERIC"
# Signal to build-release.sh that this profile requires package installation.
WITH_PACKAGES="yes"
# ABI string passed to pkg and embedded in BUILD-INFO.
PKG_ABI="FreeBSD:16:amd64"
# Official quarterly or latest branch.  "latest" tracks rolling CURRENT closely.
PKG_REPO_BRANCH="latest"
